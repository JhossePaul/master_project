[project]
name = "bbva-voc-analyzer"
version = "1.0.0"
description = "App Store Label Noise & Incident Analyzer"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "ruff>=0.3.0",
    "bandit>=1.7.8",
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pyrefly",
    "pre-commit>=3.7.0,<5.0.0",
]

[tool.uv.workspace]
members = ["packages/*", "services/*", "infra"]
# TEMPORAL: miembros con pyproject.toml aun vacio/ausente. Retirar cada
# entrada al implementar el paquete correspondiente.
exclude = [
    "services/api-backend",
]

# torch solo en CPU en Linux (CI e imagen de ml-inference, D4): las ruedas de
# PyPI traen CUDA y pesan varios GB. En macOS la rueda de PyPI ya es de CPU.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 80
target-version = "py311"
exclude = [
    ".git",
    ".ruff_cache",
    ".venv",
    "node_modules",
    "__pycache__",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",  # E: pycodestyle
    "F",  # F: pyflakes
    "I",  # I: isort
    "B",  # B: flake8-bugbear
    "S",  # S: flake8-bandit
    "UP", # UP: pyupgrade
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
exclude = ["**/*.md"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --import-mode=importlib --cov-report=term-missing"
testpaths = ["packages/*/tests", "services/*/tests", "infra/tests"]

[tool.bandit]
# experiments/ no es código de producción: experiments/analytics es un proyecto
# uv aparte y project_viability guarda el notebook de viabilidad.
exclude_dirs = [
    "tests",
    ".github",
    "docs",
    "web",
    ".venv",
    "infra/.pulumi",
    "experiments",
]
skips = ["B101"]

[tool.pyrefly]
# Mismo preset que la configuración automática previa; experiments/ no es
# código de producción (experiments/analytics es un proyecto uv aparte).
preset = "basic"
project-excludes = ["experiments/**"]
