[project]
name = "voc-analytics-experiments"
version = "0.1.0"
description = "Experimentación de EPIC-5 (EDA, etiquetado y competencia de modelos); fuera del workspace de producción"
requires-python = ">=3.11,<3.12"
dependencies = [
    "polars>=1.20,<2",
    "pyarrow>=17",
    "duckdb>=1.1,<2",
    "matplotlib>=3.9,<4",
    "lingua-language-detector>=2.0,<3",
    "emoji>=2.12,<3",
    "google-genai>=1.20,<2",
    "streamlit>=1.40,<2",
    "scikit-learn>=1.5,<2",
    "pysentimiento>=0.7,<1",
    "textblob>=0.18,<1",
    "cleanlab>=2.7,<3",
    "bertopic>=0.17,<1",
    "sentence-transformers>=5,<7",
    "umap-learn>=0.5,<1",
    "hdbscan>=0.8,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voc_analytics"]

[tool.ruff]
# Hereda la configuración de la raíz; `src` hace de `voc_analytics` un paquete
# propio para el orden de imports.
extend = "../../pyproject.toml"
src = ["src"]
