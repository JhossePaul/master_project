[project]
name = "voc-nlp"
version = "0.1.0"
description = "Lógica pura de inferencia y monitoreo de BBVA VoC Analyzer (EPIC-6), portada de voc_analytics sin cambiar el criterio"
requires-python = ">=3.11"
dependencies = [
    "voc-common",
    "numpy>=2.0,<3",
    "emoji>=2.12,<3",
]

[project.optional-dependencies]
# RoBERTuito ajustado (D11): mismas versiones mayores que EPIC-5.
sentiment = [
    "torch>=2.14,<3",
    "transformers>=5.16,<6",
    "pysentimiento>=0.7.3,<1",
]
gemini = [
    "google-genai>=1.20,<2",
]
topics = [
    "sentence-transformers>=6,<7",
    "umap-learn>=0.5,<1",
    "hdbscan>=0.8,<1",
    "bertopic>=0.17,<1",
]

[tool.uv.sources]
voc-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voc_nlp"]
