[project]
name = "voc-common"
version = "0.1.0"
description = "Contratos Pydantic, constantes RPC y configuracion centralizada para BBVA VoC Analyzer"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6.0,<3.0.0",
    "pydantic-settings>=2.7.0,<3.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
