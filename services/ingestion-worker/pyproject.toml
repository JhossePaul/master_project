[project]
name = "ingestion-worker"
version = "0.1.0"
description = "Ingesta reanudable de reseñas con adaptador batchexecute versionado"
requires-python = ">=3.11"
dependencies = [
    "voc-common",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "httpx[socks]>=0.28,<1",
    "tenacity>=9,<10",
    "google-cloud-pubsub>=2.23,<3",
    "google-cloud-storage>=2.19,<4",
    "google-cloud-bigquery>=3.27,<4",
    "pydantic>=2.6,<3",
]

[tool.uv.sources]
voc-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
