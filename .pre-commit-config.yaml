# Usa las mismas herramientas y versiones de uv.lock que el pipeline CI.
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run --frozen ruff check --fix
        language: system
        types_or: [python, pyi]

      - id: ruff-format
        name: ruff-format
        entry: uv run --frozen ruff format
        language: system
        types_or: [python, pyi]

      - id: bandit
        name: bandit
        entry: uv run --frozen bandit -c pyproject.toml -r .
        language: system
        pass_filenames: false
        always_run: true
