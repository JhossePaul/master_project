config:
  gcp:project: "project-7bafd424-a385-4c05-b5b"
  gcp:region: "us-central1"
  bbva-voc-infra:environment: "dev"
  bbva-voc-infra:free_tier_mode: "true"
  bbva-voc-infra:enable_cmek: "false"
  bbva-voc-infra:enable_vpc_sc: "false"
  # Solo la API de Vertex AI (Gemini Flash y Model Registry), sin endpoints
  # dedicados: el índice de 768 dimensiones se retiró en EPIC-6 (P8-6).
  bbva-voc-infra:enable_vertex_ai_api: "true"
  # Fase 1: APIs, Artifact Registry, SAs, bucket, Pub/Sub, BigQuery y DLP.
  # Pasar a true (fase 2) tras publicar imágenes con Cloud Build y fijarlas
  # por digest; ver docs/operations/deployment.md. Requeridas en fase 2:
  #   bbva-voc-infra:ingestion_worker_image: "<registry>/ingestion-worker:<sha>@sha256:<digest>"
  #   bbva-voc-infra:sanitization_job_image: "<registry>/sanitization-pipeline:<sha>@sha256:<digest>"
  # Opcional (sin ella no se crea voc-api-backend):
  #   bbva-voc-infra:api_backend_image: "<registry>/api-backend:<sha>@sha256:<digest>"
  # Opcional hasta publicar la imagen de 6.3 (sin ella no se crean los Jobs
  # voc-ml-inference-delta y voc-ml-monitor ni sus triggers):
  #   bbva-voc-infra:ml_inference_image: "<registry>/ml-inference:<sha>@sha256:<digest>"
  bbva-voc-infra:deploy_workloads: "true"
  # Correo de los avisos de deriva y de calidad del modelo, como secreto (el
  # repositorio es público). Sin él no se crean el canal ni las políticas de
  # Cloud Monitoring; se fija con
  #   pulumi config set --secret bbva-voc-infra:alert_email <correo>
  # Contrato compartido con Settings; metadata no sujeta al TTL crudo.
  bbva-voc-infra:gcs_watermark_prefix: "state/watermarks"
  bbva-voc-infra:gcs_raw_staging_prefix: "raw_staging"
  bbva-voc-infra:gcs_ingestion_state_prefix: "state/ingestion"
  bbva-voc-infra:gcs_ingestion_manifests_prefix: "state/ingestion/manifests"
  bbva-voc-infra:gcs_ingestion_ledgers_prefix: "state/ingestion/ledgers"
  bbva-voc-infra:gcs_processing_receipts_prefix: "state/ingestion/receipts"
  # Ingesta v2 se activa cuando imagen/entrypoint y API de EPIC-3 estén listos.
  bbva-voc-infra:ingestion_v2_enabled: "true"
  bbva-voc-infra:ingestion_execution:
    ingestion_max_requests: 100
    ingestion_max_response_bytes: 20000000
    ingestion_max_runtime_sec: 780
    ingestion_container_timeout_sec: 900
    ingestion_checkpoint_margin_sec: 60
    ingestion_lease_duration_sec: 120
    ingestion_heartbeat_interval_sec: 30
  # Imagen opcional: historical_job_image; por defecto usa ingestion_worker_image.
  bbva-voc-infra:historical_ingestion:
    command: ["python", "-m", "ingestion_worker.job"]
    max_retries: 1
    execution:
      ingestion_max_requests: 1000
      ingestion_max_response_bytes: 200000000
      ingestion_max_runtime_sec: 3480
      ingestion_container_timeout_sec: 3600
      ingestion_checkpoint_margin_sec: 120
      ingestion_lease_duration_sec: 120
      ingestion_heartbeat_interval_sec: 30
  bbva-voc-infra:user_hash_salt:
    secure: v1:sauUU8V0d1xIRh2x:QcVsWX4sG6pUOE6CsSwsK3BxKmdXFAVAaFHp7hSt1UDHqfKAzp7evn4LShB8ddTFP51b3wisUYWv8qrjuZ4KUsul0Dvcn82AkfGdmzvxflQ=
  gcp:userProjectOverride: "true"
