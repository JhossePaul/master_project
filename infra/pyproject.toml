[project]
name = "voc-infra"
version = "0.1.0"
description = "Infraestructura como Codigo (Pulumi Python) para BBVA VoC Analyzer en GCP"
requires-python = ">=3.11"
dependencies = [
    "pulumi>=3.112.0,<4.0.0",
    "pulumi-gcp>=8.0.0,<9.0.0",
    "pydantic>=2.6.0",
    "voc-common",
]

[tool.uv.sources]
voc-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Conserva la estructura infra/modules sin instalar un paquete global "modules".
# Sin force-include de infra/__init__.py: en modo editable se copiaría a
# site-packages y ocultaría el paquete del repo (infra.modules no importable).
# En el wheel normal `infra` queda como namespace package.
[tool.hatch.build]
dev-mode-dirs = [".."]

[tool.hatch.build.targets.wheel]
packages = ["modules"]

[tool.hatch.build.targets.wheel.sources]
"modules" = "infra/modules"
