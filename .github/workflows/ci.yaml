name: Quality gates

# main solo recibe cambios por PR; el ruleset exige este job (`quality`).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    # torch de CPU, transformers y BERTopic (voc-nlp, ml-inference) alargan la
    # instalación del workspace.
    timeout-minutes: 25
    env:
      ENVIRONMENT: test
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID || 'bbva-voc-analyzer-test' }}
      USER_HASH_SALT: ${{ secrets.USER_HASH_SALT || 'ci-only-salt-not-for-production' }}
      SCRAPER_PROXY_POOL_URLS: ${{ secrets.SCRAPER_PROXY_POOL_URLS || '[]' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up uv
        uses: astral-sh/setup-uv@v3

      - name: Install workspace dependencies
        run: uv sync --all-packages --locked

      - name: Ruff lint
        run: uv run --frozen ruff check .

      - name: Ruff format
        run: uv run --frozen ruff format --check .

      - name: Pyrefly types
        run: uv run --frozen pyrefly check

      - name: Bandit security
        run: uv run --frozen bandit -c pyproject.toml -r .

      - name: Unit tests and coverage
        run: >-
          uv run --frozen pytest packages/voc-common/tests
          --cov=packages/voc-common/src --cov-fail-under=85

      - name: Infrastructure contracts and deployment matrix
        run: >-
          uv run --frozen pytest infra/tests
          --cov=infra/modules --cov-fail-under=80

      - name: Ingestion protocol, state, audit and durable publication
        run: >-
          uv run --frozen pytest services/ingestion-worker/tests
          --cov=ingestion_worker --cov-fail-under=85

      - name: Sanitization pipeline
        run: >-
          uv run --frozen pytest services/sanitization-pipeline/tests
          --cov=sanitization_pipeline --cov-fail-under=85

      - name: Operational controllers
        run: >-
          uv run --frozen pytest tools/tests
          --cov=tools --cov-fail-under=85

      - name: NLP logic ported from EPIC-5
        run: >-
          uv run --frozen pytest packages/voc-nlp/tests
          --cov=packages/voc-nlp/src --cov-fail-under=85

      - name: Batch inference, loads and seed
        run: >-
          uv run --frozen pytest services/ml-inference/tests
          --cov=ml_inference --cov-fail-under=85

      - name: API and portal backend
        run: >-
          uv run --frozen pytest services/api-backend
          --cov=api_backend --cov-fail-under=85

  ingestion-image:
    # Valida que la imagen del worker construye; la publicación es del CD.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build ingestion worker image
        run: >-
          docker build --platform=linux/amd64
          --file services/ingestion-worker/Dockerfile
          --tag ingestion-worker:ci .

      - name: Smoke test entrypoints
        run: |
          docker run --rm ingestion-worker:ci python -c \
            "import ingestion_worker.job, ingestion_worker.main"
          id=$(docker run --rm ingestion-worker:ci id -u)
          test "$id" = "10001"

  sanitization-image:
    # Valida que la imagen del Job construye; la publicación es del CD.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build sanitization pipeline image
        run: >-
          docker build --platform=linux/amd64
          --file services/sanitization-pipeline/Dockerfile
          --tag sanitization-pipeline:ci .

      - name: Smoke test entrypoint
        run: |
          set +e
          docker run --rm sanitization-pipeline:ci
          code=$?
          set -e
          # Sin INGESTION_V2_ENABLED el preflight debe fallar cerrado (64).
          test "$code" = "64"
          id=$(docker run --rm --entrypoint id sanitization-pipeline:ci -u)
          test "$id" = "10001"

  ml-inference-image:
    # Valida que la imagen de los Jobs de inferencia construye (torch de CPU);
    # la publicación es del CD.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build ml-inference image
        run: >-
          docker build --platform=linux/amd64
          --file services/ml-inference/Dockerfile
          --tag ml-inference:ci .

      - name: Smoke test entrypoint
        run: |
          # Los comandos leen la configuración y abren clientes de GCP;
          # `--help` valida el entrypoint sin ninguno de los dos.
          docker run --rm ml-inference:ci --help
          docker run --rm --entrypoint python ml-inference:ci -c \
            "import ml_inference.delta, voc_nlp.sentiment_model, voc_nlp.topics; \
            from kaggle.api.kaggle_api_extended import KaggleApi"
          id=$(docker run --rm --entrypoint id ml-inference:ci -u)
          test "$id" = "10001"

  portal:
    # Frontal del portal: lint, pruebas y construcción (Node 24).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web/portal
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: web/portal/.nvmrc
          cache: npm
          cache-dependency-path: web/portal/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Tipos de la API al día
        run: |
          npm run api:types
          git diff --exit-code -- src/api/schema.d.ts

      - name: Biome
        run: npm run check

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

  api-backend-image:
    # Valida que la imagen de la API y el portal construye y arranca; la
    # publicación es del CD. Sin PyTorch: tarda lo de la imagen de ingesta.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build api-backend image
        run: >-
          docker build --platform=linux/amd64
          --file services/api-backend/Dockerfile
          --build-arg BUILD_COMMIT=${{ github.sha }}
          --tag api-backend:ci .

      - name: Smoke test
        run: |
          id=$(docker run --rm --entrypoint id api-backend:ci -u)
          test "$id" = "10001"
          docker run -d --name api -p 8080:8080 \
            -e ENVIRONMENT=dev -e GCP_PROJECT_ID=ci \
            -e IAP_AUDIENCE=/projects/1/locations/us-central1/services/voc-api-backend \
            api-backend:ci
          for _ in $(seq 1 30); do
            curl -fsS localhost:8080/healthz && break
            sleep 1
          done
          curl -fsS localhost:8080/healthz | grep -F '"commit":"${{ github.sha }}"'
          # El portal compilado va en la imagen: `/` y una ruta del cliente
          # devuelven index.html.
          curl -fsS localhost:8080/ | grep -F '<div id="root">'
          curl -fsS localhost:8080/cockpit | grep -F '<div id="root">'
          # Sin el JWT de IAP: 401 y no un error del servidor.
          code=$(curl -s -o /dev/null -w "%{http_code}" localhost:8080/api/v1/me)
          test "$code" = "401"
          # Ni PyTorch ni Beam en la imagen de la API.
          docker exec api python -c \
            "import importlib.util as u; assert not u.find_spec('torch') and not u.find_spec('apache_beam')"
          docker logs api
